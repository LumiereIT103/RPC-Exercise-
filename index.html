     function getComputerChoice() {
        let randomInt = Math.floor(Math.random() * 3); 
        let computerChoice = ""
        if (randomInt == 0) {
           computerChoice = "Rock";
        }
        else if (randomInt == 1){
           computerChoice = "Scissor"
        }
        else if (randomInt == 2){
            computerChoice = "Paper"
        }
        return computerChoice;
     }
