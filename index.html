<body>
  <div id="main">
    <div id="choices">

      <div class="choice-container" onclick="getHumanChoice('Rock'); playRound();">

        </button>

      </div>
      
      <div class="choice-container"onclick="getHumanChoice('Paper'); playRound();">

          <img src="https://img.fruugo.com/product/4/25/1781072254_max.jpg" alt="paper">
        </button>

        <p>Paper</p>
      </div>
  
      <div class="choice-container" onclick="getHumanChoice('Scissor'); playRound();">
        <button>
          <img src="https://img.freepik.com/free-photo/women-with-mugs-smiling-talking_23-2147771691.jpg" alt="Scissor">
        </button>
        <p>Scissor</p>
      </div>
    
      
  
    </div>

    <div id="bottom-box">
      <button onclick="reset()">Reset</button>
      <p id="p-score"></p>
        <p id="ai-score"></p>
        <p id="comp-choice"></p>
        <p id="human-choice"></p>
        <p id="round-status"></p>
    </div>

  </div>
  
 
  
</body>


<script>
    let humanScoreElement = document.getElementById("p-score");
    let computerScoreElement = document.getElementById("ai-score");
    let humanScore = 0;
    let computerScore = 0;
    let humanChoice ='';
    humanScoreElement.textContent = `Human Score: ${humanScore}`;
      computerScoreElement.textContent = `Computer Score: ${computerScore}`;
     function getComputerChoice() {
        let randomInt = Math.floor(Math.random() * 3); 
        let computerChoice = ""
        if (randomInt == 0) {
           computerChoice = "Rock";
        }
        else if (randomInt == 1){
           computerChoice = "Scissor"
        }
        else if (randomInt == 2){
            computerChoice = "Paper"
        }
        return computerChoice;
     }
     
     function getHumanChoice(choice){
       humanChoice = choice;
       console.log("User picked:", humanChoice);
     }
     
     function reset(){
      humanScore = 0;
      computerScore = 0;
      humanScoreElement.textContent = `Human Score: ${humanScore}`;
      computerScoreElement.textContent = `Computer Score: ${computerScore}`;
      document.getElementById("comp-choice").textContent = ``;
            document.getElementById("human-choice").textContent = ``;
            document.getElementById("round-status").textContent = ``;
     }
     
    
     function playRound(){
        const computerChoice = getComputerChoice(); 
        console.log("Computer picked:", computerChoice);


        if (!humanChoice) {
          alert("Please make a selection first!");
          return;
        }
        
          if ((humanChoice == "Rock" && computerChoice == "Scissor")||(humanChoice == "Paper" && computerChoice == "Rock")||(humanChoice == "Scissor" && computerChoice == "Paper")){
          
            console.log("Human Wins this round");
            humanScore++;
            humanScoreElement.textContent = `Human Score: ${humanScore}`;
            document.getElementById("comp-choice").textContent = `Computer chose: ${computerChoice}`;
            document.getElementById("human-choice").textContent = `Human chose: ${humanChoice}`;
            document.getElementById("round-status").textContent = `Human Won this Round`;
          }
          else if (( computerChoice== "Paper" && humanChoice == "Rock")||(computerChoice == "Scissor" && humanChoice == "Paper")||(computerChoice == "Rock" && humanChoice == "Scissor"))
          {
            console.log("Computer Wins this round");
            computerScore++;
            computerScoreElement.textContent = `Computer Score: ${computerScore}`;
            document.getElementById("comp-choice").textContent = `Computer chose: ${computerChoice}`;
            document.getElementById("human-choice").textContent = `Human chose: ${humanChoice}`;
            document.getElementById("round-status").textContent = `Computer Won this Round`;
          }
          else {
            console.log("Tie")
            document.getElementById("round-status").textContent = `No one Won this Round`;
          }
          humanChoice = '';
        }
